name: Build Release

on:
  workflow_dispatch:
    inputs:
      build_arm64:
        description: Build ARM64 package (requires self-hosted ARM64 Windows runner)
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"

jobs:
  build-x64:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install locked build environment
        shell: powershell
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-build.lock

      - name: Verify tag matches application version
        if: github.ref_type == 'tag'
        shell: powershell
        run: |
          $metadata = Get-Content "calendar_app\app_metadata.py" -Raw -Encoding utf8
          $match = [regex]::Match($metadata, 'APP_VERSION\s*=\s*"([^"]+)"')
          if (-not $match.Success) {
            throw "APP_VERSION was not found."
          }
          $expectedTag = "v$($match.Groups[1].Value)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag '$env:GITHUB_REF_NAME' does not match '$expectedTag'."
          }

      - name: Build x64 release
        shell: cmd
        run: .\build-release.bat -Arch x64 -NoBanner

      - name: Upload x64 payload
        uses: actions/upload-artifact@v4
        with:
          name: darkcalendar-dist-x64
          path: dist/x64/DarkCalendar
          if-no-files-found: error

      - name: Upload x64 MSIX
        uses: actions/upload-artifact@v4
        with:
          name: darkcalendar-msix-x64
          path: dist/x64/DarkCalendar-*-x64.msix
          if-no-files-found: error

      - name: Upload GitHub release assets
        uses: actions/upload-artifact@v4
        with:
          name: darkcalendar-github-release-x64
          path: |
            dist/x64/DarkCalendar-*-x64.msix
            dist/x64/DarkCalendar-*-x64.msix.sha256
            release/store/*-x64.msixupload
            release/store/*-x64.msixupload.sha256
            release/source/*-corresponding-source.zip
            release/source/*-corresponding-source.zip.sha256
          if-no-files-found: error

  build-arm64:
    if: github.event_name == 'workflow_dispatch' && inputs.build_arm64 == true
    runs-on:
      - self-hosted
      - Windows
      - ARM64
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install locked build environment
        shell: powershell
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-build.lock

      - name: Build arm64 release
        shell: cmd
        run: .\build-release.bat -Arch arm64 -NoBanner

      - name: Upload arm64 payload
        uses: actions/upload-artifact@v4
        with:
          name: darkcalendar-dist-arm64
          path: dist/arm64/DarkCalendar
          if-no-files-found: error

      - name: Upload arm64 MSIX
        uses: actions/upload-artifact@v4
        with:
          name: darkcalendar-msix-arm64
          path: dist/arm64/DarkCalendar-*-arm64.msix
          if-no-files-found: error

  bundle-msix:
    if: github.event_name == 'workflow_dispatch' && inputs.build_arm64 == true
    needs:
      - build-x64
      - build-arm64
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download x64 MSIX
        uses: actions/download-artifact@v4
        with:
          name: darkcalendar-msix-x64
          path: dist/x64

      - name: Download arm64 MSIX
        uses: actions/download-artifact@v4
        with:
          name: darkcalendar-msix-arm64
          path: dist/arm64

      - name: Create ARM64 and x64 Store upload
        shell: cmd
        run: .\build-release.bat -Arch x64 -UploadOnly -NoBanner

      - name: Upload combined Store package
        uses: actions/upload-artifact@v4
        with:
          name: darkcalendar-msixupload-arm64-x64
          path: |
            release/store/*-arm64_x64.msixbundle
            release/store/*-arm64_x64.msixupload
          if-no-files-found: error

  publish-github-release:
    if: github.ref_type == 'tag'
    needs:
      - build-x64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          name: darkcalendar-github-release-x64
          path: release-assets

      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $notesPath = "docs\release-$version-notes.md"
          $assets = Get-ChildItem "release-assets" -Recurse -File |
            Select-Object -ExpandProperty FullName
          if (-not $assets) {
            throw "No release assets were downloaded."
          }

          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @assets --clobber `
              --repo $env:GITHUB_REPOSITORY
          } else {
            $releaseArgs = @(
              "release", "create", $env:GITHUB_REF_NAME,
              "--repo", $env:GITHUB_REPOSITORY,
              "--verify-tag",
              "--title", "Dark Calendar $version"
            )
            if (Test-Path $notesPath -PathType Leaf) {
              $releaseArgs += @("--notes-file", $notesPath)
            } else {
              $releaseArgs += "--generate-notes"
            }
            $releaseArgs += $assets
            & gh @releaseArgs
          }

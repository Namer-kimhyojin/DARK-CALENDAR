name: Encoding Policy

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  encoding-policy:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.10"

      - name: Install Qt runtime library
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest==9.0.2 PyQt6==6.12.0

      - name: Run encoding guard
        run: python scripts/run_encoding_guard.py
